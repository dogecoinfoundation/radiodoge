[package]
name = "radiodoge-gui"
version = "0.3.13"
description = "RadioDoge — Wireless P2P Dogecoin Over LoRa (Tauri 2 GUI)"
authors = ["RadioDoge Contributors"]
license = "MIT"
repository = "https://github.com/jnowat/RadioDoge"
edition = "2021"
rust-version = "1.77.2"

# Required by Tauri 2: library crate for mobile targets
[lib]
name = "radiodoge_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core protocol library (shared with radiodoge-cli — no Tauri dependency)
# Provides: radio protocol, Dogecoin wallet, serial port management
radiodoge-core = { workspace = true }

# Tauri 2 — PNG image support (tray-icon added for desktop targets below)
# Pinned to ^2.6.2 so it is never resolved lower than what tauri-plugin-serialplugin
# requires, keeping the Rust crate and @tauri-apps/cli Android runtime in sync.
tauri = { version = "^2.6.2", features = ["image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

# v0.3.10 — Android USB serial support via tauri-plugin-serialplugin (s00d).
# Pinned to =2.22.0: v2.20.0 has "Unresolved reference: baudRate/dataBits/parity"
# because it reads UsbSerialPort properties that don't exist as getters; 2.22.0
# wraps the port in a config object and fixes all property-access Kotlin errors.
# On Android: bridges to usb-serial-for-android via JitPack + JNI.
# On desktop: plugin is registered but serial I/O goes through SerialManager.
tauri-plugin-serialplugin = "=2.22.0"

# v0.3.10 — Platform detection ("android", "windows", "linux", …)
tauri-plugin-os = "2"

# v0.3.10 — BLE client: btleplug on desktop, native Android BLE on mobile.
# Used for wireless connection to the Heltec ESP32 firmware BLE serial service.
# On Android: uses Android BluetoothLeScanner / GATT APIs natively.
# On desktop: uses btleplug (Windows/macOS/Linux host BLE adapter).
tauri-plugin-blec = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# Serial port communication (cross-platform, Android-ready via serialport-android later)
serialport = "4"

# Pure Rust Dogecoin cryptography — no FFI to libdogecoin needed
# Dogecoin uses the same secp256k1 curve as Bitcoin
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
rand = "0.8"
hex = "0.4"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Desktop-only: system tray (not available on Android/iOS)
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "^2.6.2", features = ["tray-icon"] }

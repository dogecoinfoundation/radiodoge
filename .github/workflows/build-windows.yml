# RadioDoge — Windows MSI Build Workflow
#
# Builds on every push to master/main and when a GitHub Release is created.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  HOW TO GET YOUR MSI                                                │
# │                                                                     │
# │  On every push to master:                                           │
# │    Actions tab → "🐕 Build Windows MSI" → Artifacts → download zip │
# │                                                                     │
# │  On GitHub Release:                                                 │
# │    MSI auto-attaches to the release for permanent download          │
# └─────────────────────────────────────────────────────────────────────┘
#
# Signing (optional):
#   cargo tauri signer generate -w ~/.tauri/radiodoge.key
#   Add to repo Secrets:
#     TAURI_SIGNING_PRIVATE_KEY          ← base64 .key file
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD ← passphrase

name: 🐕 Build Windows MSI

on:
  push:
    branches: [master, main, '0.0.1-Beta-1']
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: msi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: 🪟 Windows x64 MSI
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to upload assets

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 🔍 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Read version ──────────────────────────────────────────────────────
      - name: 📋 Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./radiodoge-gui/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Building RadioDoge v$VERSION"

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      # NOTE: No `cache:` option here.
      # The npm cache option in setup-node requires a valid, non-empty
      # package-lock.json to compute the cache key. If the lockfile is missing
      # or empty it throws "Some specified paths were not resolved, unable to
      # cache dependencies" and the job dies before a single line of Rust
      # compiles. Skipping npm caching here is the simplest reliable fix.
      # Build speed impact: ~30s extra per run — totally worth it for reliability.
      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Rust stable (Windows MSVC) ────────────────────────────────────────
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── 5. Rust build cache ──────────────────────────────────────────────────
      # NOTE: No `workspaces:` option here.
      # Specifying `workspaces: . -> target` makes rust-cache require a Cargo.lock
      # at the repo root. We have a workspace Cargo.toml but Cargo.lock is only
      # generated on first `cargo build` — so there is no Cargo.lock to hash on a
      # fresh clone, which causes another "path not resolved" error.
      # Without the option, rust-cache auto-detects from any Cargo.toml it finds.
      - name: 🗃️ Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ── 6. Frontend dependencies ─────────────────────────────────────────────
      # Use `npm install` rather than `npm ci`.
      # `npm ci` aborts if package-lock.json is absent, empty, or out-of-sync.
      # `npm install` generates or repairs the lock file as needed — much safer
      # for a CI workflow where the lockfile may not be perfectly maintained.
      - name: 📥 Install frontend dependencies
        working-directory: radiodoge-gui
        run: npm install

      # ── 7a. Build radiodoge-cli sidecar ──────────────────────────────────────
      # Build the headless CLI and copy it into the src-tauri directory so Tauri
      # bundles it alongside the main executable in the MSI.
      # Tauri sidecar convention: binary name must end in the target triple.
      - name: 🔨 Build radiodoge-cli sidecar
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build -p radiodoge-cli --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path "radiodoge-gui\src-tauri\binaries" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\radiodoge-cli.exe" `
            "radiodoge-gui\src-tauri\binaries\radiodoge-cli-x86_64-pc-windows-msvc.exe"
          Write-Host "radiodoge-cli sidecar built and staged ✅"
        shell: pwsh

      # ── 7b. Build the MSI ────────────────────────────────────────────────────
      # --bundles msi  : WiX MSI only; skip NSIS (regularly 502s during CI)
      # --verbose      : full output so failures are diagnosable
      # CARGO_INCREMENTAL=0 : avoids stale/corrupt incremental cache artefacts
      #
      # Retry loop handles transient WiX toolset download failures (GitHub
      # Releases sometimes returns 502/503 on first attempt).
      - name: 🚀 Build MSI
        working-directory: radiodoge-gui
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $maxAttempts = 3
          $attempt    = 0
          $delay      = 15   # seconds; doubles each retry (15 → 30 → 60)

          while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "🐕 Build attempt $attempt / $maxAttempts ..."

            npx tauri build --target x86_64-pc-windows-msvc --bundles msi --verbose

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Succeeded on attempt $attempt. Such build. Wow."
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "⚠️  Attempt $attempt failed (exit $LASTEXITCODE). Retrying in ${delay}s ..."
              Start-Sleep -Seconds $delay
              $delay = $delay * 2
            } else {
              Write-Host "❌ All $maxAttempts attempts failed. No MSI. Very sad. 😢"
              exit 1
            }
          }

      # ── 8. Find the MSI (debug — runs even on failure) ───────────────────────
      # Prints the exact path of every .msi produced so we know where to look.
      # The workspace Cargo.toml puts target/ at the repo root; tauri may also
      # write to radiodoge-gui/src-tauri/target/. This step shows us which.
      - name: 🔎 Find generated MSI files
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Searching for *.msi files ==="
          $files = Get-ChildItem -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($files) {
            $files | ForEach-Object { Write-Host "  FOUND: $($_.FullName)" }
          } else {
            Write-Host "  (none found — build likely failed before bundling)"
            Write-Host ""
            Write-Host "=== Root directory listing ==="
            Get-ChildItem | Select-Object Name, Length
            Write-Host ""
            Write-Host "=== radiodoge-gui/ listing ==="
            Get-ChildItem radiodoge-gui -ErrorAction SilentlyContinue | Select-Object Name
          }

      # ── 9a. Upload artifact (push / manual dispatch) ─────────────────────────
      # Wildcard path finds the MSI regardless of whether Cargo puts it under
      # the workspace root target/ or inside radiodoge-gui/src-tauri/target/.
      - name: 📤 Upload MSI artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
        uses: actions/upload-artifact@v4
        with:
          name: RadioDoge-${{ steps.version.outputs.value }}-windows-x64-msi
          path: "**/bundle/msi/*.msi"
          retention-days: 30
          if-no-files-found: error

      # ── 9b. Attach to GitHub Release ─────────────────────────────────────────
      - name: 📎 Attach MSI to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "**/bundle/msi/*.msi"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Job summary ───────────────────────────────────────────────────────
      - name: 📋 Summary
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          echo "## 🐕 RadioDoge v${{ steps.version.outputs.value }} MSI — Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scroll to Artifacts below → click the zip → unzip → run the .msi**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Much CI. Very reliable. Wow. 🐕🌙*" >> $GITHUB_STEP_SUMMARY

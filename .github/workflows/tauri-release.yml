# RadioDoge — Tauri 2 Automated Release Builder
#
# Triggers automatically on every push to master.
# Reads the version from radiodoge-gui/package.json, creates (or updates)
# a GitHub Release tagged v<version>, and uploads the Windows x64 MSI.
#
# To release a new version:
#   1. Bump "version" in radiodoge-gui/package.json (and Cargo.toml / tauri.conf.json)
#   2. Push to master — the MSI builds and uploads automatically. That's it.
#
# Optional repository secrets (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY         — base64-encoded updater signing key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — passphrase for the signing key
#   Generate with: cargo tauri signer generate -w ~/.tauri/radiodoge.key

name: 🐕 Build & Release Windows MSI

on:
  push:
    branches:
      - master        # fires on every push to master — fully automated
  workflow_dispatch:  # also manually triggerable from the Actions tab

# Cancel any in-progress build for the same branch so only the latest commit wins
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: 🪟 Build Windows x64 MSI
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for tauri-action to create releases

      # ── Read app version from package.json ──────────────────────────────────
      # This is the single source of truth for the release tag and name.
      # Update "version" in radiodoge-gui/package.json to cut a new release.
      - name: 📋 Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./radiodoge-gui/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"  >> $GITHUB_OUTPUT
          echo "Building RadioDoge v$VERSION"

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: 🦀 Install Rust stable (Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 🗃️ Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: radiodoge-gui/src-tauri -> target
          cache-on-failure: true

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: 📥 Install frontend dependencies
        working-directory: radiodoge-gui
        run: npm install

      # ── Tauri Build + GitHub Release ─────────────────────────────────────────
      - name: 🚀 Build MSI and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: radiodoge-gui
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: '🐕 RadioDoge ${{ steps.version.outputs.tag }}'
          releaseBody: |
            ## RadioDoge ${{ steps.version.outputs.tag }} — Wireless P2P Dogecoin Over LoRa

            ### 🚀 Quick Install (Windows 10/11 x64)

            1. Download **RadioDoge_${{ steps.version.outputs.value }}_x64_en-US.msi** below
            2. Double-click to install
            3. Plug in your Heltec ESP32 LoRa board via USB
            4. Click **Connect**, select your COM port, and start sending DOGE! 🐕🌙

            ### What's New
            See [CHANGELOG.md](https://github.com/jnowat/RadioDoge/blob/master/CHANGELOG.md) for full release notes.

            ### Requirements
            - Windows 10 or 11, 64-bit
            - Heltec WiFi LoRa 32 V3 board with RadioDoge firmware

            ---
            *Much wireless. Very transaction. Such LoRa. Wow. 🐕*
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles msi

# RadioDoge — Tauri 2 Release Builder
#
# Triggers on Git tags matching v* (e.g. v0.2.0, v1.0.0)
# Builds a signed Windows x64 MSI installer using WiX bundler
# Uploads the .msi as a GitHub Release artifact
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY         — base64-encoded private key for update signing
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — passphrase for the private key
#
# Generate signing keys with:
#   cargo tauri signer generate -w ~/.tauri/radiodoge.key
# Then add the key contents and password as repository secrets.

name: 🐕 Tauri Release (Windows MSI)

on:
  push:
    tags:
      - 'v*'

# Only one release build at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: 🔍 Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: radiodoge-gui/package-lock.json

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: 🦀 Install Rust (stable, Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 🗃️ Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: radiodoge-gui/src-tauri -> target
          cache-on-failure: true

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: 📥 Install frontend dependencies
        working-directory: radiodoge-gui
        run: npm ci

      # ── Tauri Build + Release ─────────────────────────────────────────────
      - name: 🚀 Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # GitHub token for creating the release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (optional but recommended)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: radiodoge-gui
          tagName: ${{ github.ref_name }}
          releaseName: '🐕 RadioDoge ${{ github.ref_name }}'
          releaseBody: |
            ## RadioDoge ${{ github.ref_name }} — Wireless P2P Dogecoin

            ### 🚀 Quick Install (Windows)
            Download **RadioDoge_${{ github.ref_name }}_x64_en-US.msi** below and run it.

            ### What's New
            See [CHANGELOG.md](https://github.com/jnowat/RadioDoge/blob/main/CHANGELOG.md) for details.

            ### Requirements
            - Windows 10/11 (x64)
            - Heltec ESP32 LoRa board with RadioDoge firmware

            ### Getting Started
            1. Flash the Heltec firmware (see [docs/](https://github.com/jnowat/RadioDoge/tree/main/docs))
            2. Install the MSI
            3. Connect your Heltec via USB
            4. Click Connect and start sending DOGE! 🐕🌙

            ---
            *Much wireless. Very transaction. Wow.*
          releaseDraft: false
          prerelease: false
          # Build only for Windows x64 MSI in CI (add macOS/Linux jobs separately if desired)
          args: --target x86_64-pc-windows-msvc --bundles msi

  # ── Optional: Notify on success ───────────────────────────────────────────
  notify-success:
    name: Release notification
    runs-on: ubuntu-latest
    needs: build-windows
    if: success()
    steps:
      - name: 🎉 Release complete
        run: |
          echo "🐕 RadioDoge ${{ github.ref_name }} released successfully!"
          echo "Much build. Very CI. Wow."

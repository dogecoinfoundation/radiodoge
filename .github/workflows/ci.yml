# RadioDoge — Fast CI Workflow
#
# Runs on every push and PR to catch compile errors, test failures, and
# clippy warnings before the slow Windows MSI and Android APK builds fire.
#
# Jobs:
#   rust   — cargo check / test / clippy across the full workspace
#   svelte — npm run check (Svelte type-check via svelte-check)

name: 🐕 CI

on:
  push:
    branches: [master, main, '0.0.1-Beta-1', 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [master, main, '0.0.1-Beta-1']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: 🦀 Rust check / test / clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo check (workspace, non-GUI crates)
        run: cargo check -p radiodoge-core -p radiodoge-cli

      - name: cargo test (workspace, non-GUI crates)
        run: cargo test -p radiodoge-core -p radiodoge-cli

      - name: cargo clippy (non-GUI crates, deny warnings)
        run: cargo clippy -p radiodoge-core -p radiodoge-cli -- -D warnings

  svelte:
    name: 🔷 Svelte type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: radiodoge-gui
        run: npm install

      - name: Svelte type-check
        working-directory: radiodoge-gui
        run: npm run check
